<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Worm — Palm OS</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #171b20; }
body { min-height: 100vh; display: grid; place-items: center; padding: 18px; }

.palm {
  width: min(428px, 96vw);
  height: min(720px, 96vh);
  padding: clamp(15px, 4vw, 28px);
  border-radius: 34px 34px 42px 42px;
  background: linear-gradient(155deg, #dce0e5 0%, #bfc4cb 48%, #9299a3 100%);
  box-shadow: 0 2px 0 #fff9 inset, 0 -4px 0 #0003 inset, 0 24px 65px #0009;
  display: flex;
  flex-direction: column;
}

.glass {
  position: relative;
  flex: 1; /* Makes the screen area fill the 720px Palm body */
  padding: 10px;
  border-radius: 11px;
  background: #090b0e;
  box-shadow: 0 0 0 3px #252a31, 0 3px 8px #0009 inset;
}

canvas {
  display: block;
  width: 100%;
  height: 100%; /* Fills the .glass container cleanly */
  background: #000;
  border-radius: 3px;
  touch-action: none;
  outline: none;
}

.off {
  position: absolute;
  inset: 10px;
  display: grid;
  place-items: center;
  background: #000;
  color: #68737c;
  text-align: center;
  font: 14px/1.5 system-ui, sans-serif;
  pointer-events: none;
}

.off.hide { display: none; }
#status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

@media (max-width: 428px) {
  body { padding: 8px; }
  .palm { border-radius: 25px; padding: 14px; }
}
</style>



</head>
<script src="https://warrobotdoge.com/bookworm/emu/cloudpilot-emu.js"></script>
<body>
<main class="palm" aria-label="Palm OS emulator">
  <div class="glass">
    <canvas id="screen" width="428" height="720.42" tabindex="0" aria-label="Palm OS screen"></canvas>
    <div class="off" id="off">Starting Palm OS…</div>
  </div>
</main>
<div id="status" role="status" aria-live="polite">Loading emulator…</div>
<script>
const SOURCES = {
  rom: 'https://warrobotdoge.com/bookworm/downloads/repalm-paravirtualized-09282026.bin',
  game: 'https://warrobotdoge.com/bookworm/downloads/BookWorm-HiRes.prc'
};
const $ = s => document.querySelector(s);
const say = m => { $('#status').textContent = m; console.log('[Book Worm]', m); };
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('bookworm-palm', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function kv(mode, key, val) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const st = db.transaction('kv', mode === 'get' ? 'readonly' : 'readwrite').objectStore('kv');
      const q = mode === 'get' ? st.get(key) : mode === 'set' ? st.put(val, key) : st.delete(key);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  } catch (e) { console.warn('Browser storage unavailable', e); }
}
async function download(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('Download failed: HTTP ' + r.status + ' (' + url + ')');
  return new Uint8Array(await r.arrayBuffer());
}
async function getFile(key) {
  const url = SOURCES[key];
  const cached = await kv('get', 'file:' + url);
  if (cached?.data) { say('Using cached ' + key + ' file…'); return cached.data; }
  say('Downloading ' + key + '…');
  const data = await download(url);
  await kv('set', 'file:' + url, {data});
  return data;
}
const emuPromise = cloudpilot.createEmulator({
  cloudpilotModuleUrl: 'emu/cloudpilot_web.wasm',
  uarmModuleUrl: 'emu/uarm_web.wasm',
  uarmWorkerUrl: 'emu/uarm-worker.js',
  pcmWorkletUrl: 'emu/pcm-worklet.js'
});
let emu;
let starting = false;
function waitForUi(instance) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; clearInterval(timer); resolve(); } };
    instance.isUiInitializedChangeEvent.addHandler(v => { if (v) finish(); });
    const timer = setInterval(async () => {
      try { if (await instance.isUiInitialized()) finish(); } catch (_) {}
    }, 400);
  });
}
async function boot(rom, game) {
  if (starting) return;
  starting = true;
  try {
    emu = await emuPromise;
    // Audio may require a user gesture in some browsers; boot continues if blocked.
    try { await emu.initializeAudio(); } catch (_) {}
    say('Starting Palm OS…');
    await emu.loadRom(rom, undefined, cloudpilot.DeviceId.repalmPV, undefined,
      cloudpilot.ScreenSize.screen320x320);
    emu.setCanvas($('#screen'));
    emu.bindInput();
    $('#off').classList.add('hide');
    await emu.resume();
    await waitForUi(emu);
    say('Launching Book Worm…');
    await emu.installAndLaunchDatabase(game);
    say('Book Worm is running.');
    $('#screen').focus();
  } catch (e) {
    console.error(e);
    say('Emulator could not start: ' + (e?.message || e));
    $('#off').classList.remove('hide');
    $('#off').textContent = 'Unable to start. Check the browser console.';
    starting = false;
  }
}
(async function autoStart() {
  try {
    say('Preparing Palm OS…');
    const [rom, game] = await Promise.all([getFile('rom'), getFile('game')]);
    await emuPromise;
    await boot(rom, game);
  } catch (e) {
    console.error(e);
    say('Loading failed: ' + (e?.message || e));
    $('#off').textContent = 'Could not load emulator files. Check your connection and refresh.';
  }
})();
</script>
</body>
</html>
